<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>分類管理 · AURAFIT 後台</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin">
  <div class="admin-layout">
    <aside class="sidebar" id="admin-sidebar"></aside>
    <main class="admin-main">
      <div class="admin-head">
        <div>
          <h1>分類管理</h1>
          <p>管理商品分類與排序</p>
        </div>
        <button class="btn btn-dark btn-sm" id="add-btn">＋ 新增分類</button>
      </div>

      <div class="table-wrap">
        <table class="data">
          <thead>
            <tr><th>名稱</th><th>代稱 (slug)</th><th>說明</th><th>商品數</th><th>排序</th><th>操作</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="modal-mask" id="modal" hidden>
    <div class="modal" style="max-width:520px">
      <h3 id="modal-title">新增分類</h3>
      <form id="category-form" class="form-grid">
        <input type="hidden" id="c-id" />
        <div class="field">
          <label>分類名稱 *</label>
          <input id="c-name" required placeholder="例如：上衣" />
        </div>
        <div class="field">
          <label>代稱 slug *（英文小寫，供網址使用）</label>
          <input id="c-slug" required placeholder="tops" />
        </div>
        <div class="field">
          <label>說明</label>
          <textarea id="c-description" rows="2"></textarea>
        </div>
        <div class="field">
          <label>排序（數字越小越前面）</label>
          <input id="c-sort" type="number" value="0" />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="cancel-btn">取消</button>
          <button type="submit" class="btn btn-dark">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="admin.js"></script>
  <script>
    let categories = [];
    if (requireAdmin()) { renderSidebar('categories'); load(); }

    async function load() {
      try {
        categories = await API.get('/api/categories');
        document.getElementById('rows').innerHTML = categories.length
          ? categories.map((c) => `
            <tr>
              <td><b>${escapeHtml(c.name)}</b></td>
              <td><code>${escapeHtml(c.slug)}</code></td>
              <td class="muted">${escapeHtml(c.description || '—')}</td>
              <td>${c.product_count}</td>
              <td>${c.sort_order}</td>
              <td>
                <div class="row-actions">
                  <button class="btn btn-ghost btn-sm" data-edit="${c.id}">編輯</button>
                  <button class="btn btn-danger btn-sm" data-del="${c.id}">刪除</button>
                </div>
              </td>
            </tr>`).join('')
          : '<tr><td colspan="6" class="empty-row">尚無分類</td></tr>';
      } catch (err) { showError(err); }
    }

    function openModal(cat) {
      document.getElementById('modal').hidden = false;
      document.getElementById('modal-title').textContent = cat ? '編輯分類' : '新增分類';
      document.getElementById('c-id').value = cat ? cat.id : '';
      document.getElementById('c-name').value = cat ? cat.name : '';
      document.getElementById('c-slug').value = cat ? cat.slug : '';
      document.getElementById('c-description').value = cat ? cat.description : '';
      document.getElementById('c-sort').value = cat ? cat.sort_order : 0;
    }
    function closeModal() { document.getElementById('modal').hidden = true; }

    document.getElementById('add-btn').onclick = () => openModal(null);
    document.getElementById('cancel-btn').onclick = closeModal;
    document.getElementById('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });

    document.getElementById('rows').addEventListener('click', async (e) => {
      const editId = e.target.dataset.edit;
      const delId = e.target.dataset.del;
      if (editId) openModal(categories.find((c) => c.id === Number(editId)));
      else if (delId) {
        const c = categories.find((x) => x.id === Number(delId));
        if (!(await confirmDialog(`確定刪除分類「${c.name}」？此分類下的商品將變為「未分類」。`))) return;
        try { await API.del('/api/admin/categories/' + delId); toast('已刪除分類', 'success'); load(); }
        catch (err) { showError(err); }
      }
    });

    document.getElementById('category-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('c-id').value;
      const payload = {
        name: document.getElementById('c-name').value.trim(),
        slug: document.getElementById('c-slug').value.trim(),
        description: document.getElementById('c-description').value.trim(),
        sort_order: Number(document.getElementById('c-sort').value) || 0,
      };
      try {
        if (id) await API.put('/api/admin/categories/' + id, payload);
        else await API.post('/api/admin/categories', payload);
        toast('已儲存分類', 'success');
        closeModal();
        load();
      } catch (err) { showError(err); }
    });
  </script>
</body>
</html>
